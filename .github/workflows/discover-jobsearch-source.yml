name: Undersoeg jobsoegningsdata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-jobsearch-source.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soeg metadata i Jobindsats API
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          token = os.environ.get('JOBINDSATS_API_TOKEN')
          if not token:
              raise SystemExit('API_ADGANG mangler')

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'Danske-A-kasser-jobsearch-discovery/1.0',
              })
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          tables = get('https://api.jobindsats.dk/v3/tables?format=json')
          keywords = ('jobsøg', 'jobsoeg', 'joblog', 'jobansøg', 'jobansog', 'jobsøgn', 'jobsogn')

          def text_of(obj):
              if isinstance(obj, dict):
                  return ' '.join(text_of(v) for v in obj.values())
              if isinstance(obj, list):
                  return ' '.join(text_of(v) for v in obj)
              return str(obj)

          def candidate_dicts(obj):
              if isinstance(obj, dict):
                  yield obj
                  for v in obj.values():
                      yield from candidate_dicts(v)
              elif isinstance(obj, list):
                  for v in obj:
                      yield from candidate_dicts(v)

          matches = []
          seen = set()
          for d in candidate_dicts(tables):
              low = text_of(d).lower()
              if any(k in low for k in keywords):
                  marker = json.dumps(d, ensure_ascii=False, sort_keys=True)
                  if marker not in seen:
                      seen.add(marker)
                      matches.append(d)

          ids = []
          for d in matches:
              for key in ('table_id','tableId','id'):
                  val = d.get(key) if isinstance(d, dict) else None
                  if isinstance(val, str) and re.fullmatch(r'[A-Za-z0-9_-]+', val) and val not in ids:
                      ids.append(val)

          specs = {}
          for table_id in ids[:20]:
              try:
                  specs[table_id] = get(f'https://api.jobindsats.dk/v3/table/{table_id}?format=json')
              except Exception as exc:
                  specs[table_id] = {'error': type(exc).__name__, 'message': str(exc)[:300]}

          out = {
              'keywords': list(keywords),
              'match_count': len(matches),
              'candidate_table_ids': ids[:20],
              'matches': matches[:60],
              'specs': specs,
          }
          Path('status').mkdir(exist_ok=True)
          Path('status/jobsearch-api-discovery.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('match_count=', len(matches))
          print('candidate_table_ids=', ids[:20])
          PY
      - name: Gem resultat
        shell: bash
        run: |
          git config user.name "Dashboard source discovery"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add status/jobsearch-api-discovery.json
          git commit -m "Gem Jobindsats jobsoegningskilde-diagnose"
          git push origin HEAD:main

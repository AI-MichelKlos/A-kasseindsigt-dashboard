name: Undersoeg jobsoegningskilde

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-jobsearch-source.yml

permissions:
  contents: write

concurrency:
  group: a-kasseindsigt-jobsearch-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Undersoeg Jobindsats v3 metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import jobindsats_api as ji

          OUT = Path("status/jobsearch-api-discovery.json")
          OUT.parent.mkdir(exist_ok=True)

          result = {
              "checkedAt": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "officialReport": "Dagpengemodtageres jobsoegning",
              "officialReportUrl": "https://www.jobindsats.dk/rapportbank/rapporter/dagpengemodtageres-jobsogning/",
              "targets": [
                  "andel dagpengemodtagere med mindst en jobansoegning i maaneden",
                  "andel dagpengemodtagere uden registrerede jobsoegninger i maaneden",
                  "gennemsnitligt antal jobsoegninger",
              ],
              "apiRoot": ji.API_ROOT,
              "apiAccess": None,
              "attempts": [],
              "candidateCount": 0,
              "candidates": [],
          }

          if not os.environ.get("JOBINDSATS_API_TOKEN"):
              result["apiAccess"] = "missing_token"
              OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
              raise SystemExit(0)

          tables = None
          for attempt in range(1, 6):
              try:
                  tables = ji.get("tables", {"format": "json"})
                  result["attempts"].append({"attempt": attempt, "state": "ok"})
                  result["apiAccess"] = "ok"
                  break
              except Exception as exc:
                  result["attempts"].append({"attempt": attempt, "state": "error", "error": str(exc)[:500]})
                  if attempt < 5:
                      time.sleep(20 * attempt)

          if tables is None:
              result["apiAccess"] = "failed"
              OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
              raise SystemExit(0)

          def normalized(value):
              return ji.norm(value)

          def table_id_of(item):
              value = item.get("table_id") if isinstance(item, dict) else None
              if not value and isinstance(item, dict):
                  candidate = item.get("id")
                  if isinstance(candidate, str) and re.fullmatch(r"y[0-9a-z_]+", candidate.lower()):
                      value = candidate
              return str(value) if value else None

          def score_text(text):
              text = normalized(text)
              score = 0
              hits = []
              rules = [
                  ("jobsoeg", 40),
                  ("jobansog", 40),
                  ("joblog", 40),
                  ("dagpengemodtager", 8),
                  ("benchmark", 6),
                  ("ansoegning", 5),
              ]
              for needle, points in rules:
                  if needle in text:
                      score += points
                      hits.append(needle)
              return score, hits

          best = {}
          global_hit_count = 0
          for item in ji.walk(tables):
              if not isinstance(item, dict):
                  continue
              raw = json.dumps(item, ensure_ascii=False, sort_keys=True)
              score, hits = score_text(raw)
              if score < 40:
                  continue
              global_hit_count += 1
              table_id = table_id_of(item)
              if not table_id:
                  continue
              previous = best.get(table_id)
              compact = {
                  "tableId": table_id,
                  "score": score,
                  "hits": hits,
                  "metadata": raw[:1600],
              }
              if previous is None or score > previous["score"]:
                  best[table_id] = compact

          candidates = sorted(best.values(), key=lambda x: (-x["score"], x["tableId"]))[:30]

          def keyword_strings(value, path=""):
              found = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      found.extend(keyword_strings(child, f"{path}.{key}" if path else str(key)))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      found.extend(keyword_strings(child, f"{path}[{index}]"))
              elif isinstance(value, (str, int, float)):
                  text = str(value)
                  score, hits = score_text(text)
                  if score >= 40:
                      found.append({"path": path, "value": text[:700], "hits": hits})
              return found

          for candidate in candidates:
              table_id = candidate["tableId"]
              try:
                  spec = ji.get(f"table/{table_id}", {"format": "json"})
                  candidate["specAccess"] = "ok"
                  candidate["specKeywordHits"] = keyword_strings(spec)[:40]
              except Exception as exc:
                  candidate["specAccess"] = "error"
                  candidate["specError"] = str(exc)[:500]

          result["globalMetadataHitCount"] = global_hit_count
          result["candidateCount"] = len(candidates)
          result["candidates"] = candidates
          result["conclusion"] = (
              "candidate_tables_found" if candidates else
              "no_jobsearch_measurement_found_in_v3_tables_metadata"
          )
          OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({
              "apiAccess": result["apiAccess"],
              "globalMetadataHitCount": global_hit_count,
              "candidateCount": len(candidates),
              "candidateIds": [item["tableId"] for item in candidates],
              "conclusion": result["conclusion"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Gem diagnoseresultat
        shell: bash
        run: |
          git config user.name "Dashboard source discovery"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add status/jobsearch-api-discovery.json
          if git diff --cached --quiet; then
            echo "Diagnoseresultatet er uændret."
          else
            git commit -m "Gem Jobindsats jobsoegningskilde-diagnose"
            git push origin HEAD:main
          fi
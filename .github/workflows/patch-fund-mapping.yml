name: Anvend DAK navnestandard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-fund-mapping.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kobl DAK navnetabel paa datamapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/fetch_sources.py')
          text = path.read_text(encoding='utf-8')
          if 'NAMES = BASE / "config" / "a-kasse-navne.json"' not in text:
              text = text.replace('OUT = BASE / "data" / "dashboard-data.json"\n', 'OUT = BASE / "data" / "dashboard-data.json"\nNAMES = BASE / "config" / "a-kasse-navne.json"\n')

          start = text.index('def fund_key(name):')
          end = text.index('\ndef match_fund', start)
          replacement = '''def load_name_reference():
              data = json.loads(NAMES.read_text(encoding="utf-8"))
              rows = data.get("funds", [])
              aliases = {}
              by_key = {}
              for row in rows:
                  key = row.get("starCode") or ji.norm(row.get("dakName"))
                  by_key[key] = row
                  for field in ("dakName", "dakShort", "dstName", "jobindsatsName", "starMemberName"):
                      alias = ji.norm(row.get(field))
                      if alias:
                          aliases[alias] = key
              return rows, aliases, by_key


          DAK_NAME_ROWS, DAK_ALIASES, DAK_BY_KEY = load_name_reference()


          def fund_key(name):
              text = ji.norm(name)
              if text in DAK_ALIASES:
                  return DAK_ALIASES[text]
              simplified = re.sub(r"\\b(fra|inkl|jan|januar|juli)\\b.*$", "", text).strip()
              for alias, key in DAK_ALIASES.items():
                  alias_simple = re.sub(r"\\b(fra|inkl|jan|januar|juli)\\b.*$", "", alias).strip()
                  if simplified and simplified == alias_simple:
                      return key
              return simplified or text


          def dak_ref(name):
              return DAK_BY_KEY.get(fund_key(name))

          '''
          text = text[:start] + replacement + text[end+1:]

          old = '''    names = {code: names_all.get(code, code) for code in selected}
              for code in selected:
                  funds[code] = {"code": code, "name": names[code], "members": members.get(code, {"labels": [], "values": []}), "profileAge": [], "profileSex": [], "jobindsats": {}}
          '''
          new = '''    source_names = {code: names_all.get(code, code) for code in selected}
              names = {}
              for code in selected:
                  ref = {} if code == fund_total else (dak_ref(source_names[code]) or {})
                  names[code] = "I alt" if code == fund_total else (ref.get("dakName") or source_names[code])
                  funds[code] = {
                      "code": code,
                      "name": names[code],
                      "short": "I alt" if code == fund_total else ref.get("dakShort"),
                      "starCode": None if code == fund_total else ref.get("starCode"),
                      "sourceNames": {
                          "dst": source_names[code],
                          "jobindsats": None if code == fund_total else ref.get("jobindsatsName"),
                          "starMembers": None if code == fund_total else ref.get("starMemberName"),
                      },
                      "members": members.get(code, {"labels": [], "values": []}),
                      "profileAge": [],
                      "profileSex": [],
                      "jobindsats": {},
                  }
          '''
          if old not in text:
              raise SystemExit('Kunne ikke finde DST-navneblokken i fetch_sources.py')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/update-dashboard.yml')
          wtext = workflow.read_text(encoding='utf-8')
          if '      - config/**\n' not in wtext:
              wtext = wtext.replace('      - scripts/**\n', '      - scripts/**\n      - config/**\n')
              workflow.write_text(wtext, encoding='utf-8')

          readme = Path('README.md')
          rtext = readme.read_text(encoding='utf-8')
          if '## Navnestandard' not in rtext:
              rtext += '''\n## Navnestandard\n\n`config/a-kasse-navne.json` er den interne navnebro mellem Danske A-kassers foretrukne visningsnavne, Danmarks Statistik, Jobindsats.dk og STARs medlemstal. Dashboardet viser DAK-navnet, mens kildealiaserne kun bruges til sikker datamatching. Tabellen er opgjort april 2026.\n'''
              readme.write_text(rtext, encoding='utf-8')
          PY
          python -m py_compile scripts/fetch_sources.py scripts/run_update.py
          git config user.name "Dashboard maintenance"
          git config user.email "dashboard-maintenance@users.noreply.github.com"
          git add scripts/fetch_sources.py .github/workflows/update-dashboard.yml README.md
          git rm .github/workflows/patch-fund-mapping.yml
          git commit -m "Brug DAK-navne og eksplicit kildealiasing"
          git push

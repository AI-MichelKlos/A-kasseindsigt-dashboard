name: Patch a-kasse mapping

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-fund-mapping.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ret canonical a-kasse mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/fetch_sources.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def fund_key(name):')
          end = text.index('\ndef match_fund', start)
          replacement = '''def fund_key(name):
              text = ji.norm(name)
              text = re.sub(r"\\b(fra|inkl|jan|januar|juli)\\b.*$", "", text).strip()
              text = re.sub(r"\\b(arbejdsloeshedskasse|a kassen|a kasse|akasse)\\b", " ", text)
              text = re.sub(r"\\s+", " ", text).strip()
              aliases = {
                  "a til": "atil",
                  "funktionaerer og tjenestemaend ftf a": "atil",
                  "ftf a": "atil",
                  "frie": "frie",
                  "akademikernes": "akademikerne",
                  "akademikerne": "akademikerne",
                  "ase": "ase",
                  "borne og ungdomspaedagoger bupl a": "bupl",
                  "borne og ungdomspaedagoger bupl": "bupl",
                  "bupl": "bupl",
                  "det faglige hus": "detfagligehus",
                  "din faglige": "dinfaglige",
                  "din sundhedsfaglige dsa": "dsa",
                  "din sundhedsfaglige": "dsa",
                  "fag og arbejde foa": "foa",
                  "foas": "foa",
                  "foa": "foa",
                  "faglig faelles 3f": "3f",
                  "faglig faelles": "3f",
                  "handels og kontorfunktionaerer hk": "hk",
                  "hk danmarks": "hk",
                  "journalistik kommunikation og sprog": "jks",
                  "for journalistik komm og sprog": "jks",
                  "journalistik komm og sprog": "jks",
                  "kristelig": "krifa",
                  "laerere dlf a": "laererne",
                  "laerere dlf": "laererne",
                  "laerernes": "laererne",
                  "ledere": "lederne",
                  "lederne": "lederne",
                  "magistre ma": "magistrene",
                  "magistrenes": "magistrene",
                  "metalarbejdere": "metal",
                  "metalarbejdernes": "metal",
                  "min": "min",
                  "oekonomer ca": "ca",
                  "ca": "ca",
                  "socialpaedagoger sla": "socialpaedagogerne",
                  "socialpaedagogernes": "socialpaedagogerne",
                  "teknikere": "teknikerne",
                  "teknikernes": "teknikerne",
              }
              return aliases.get(text, text)

          '''
          path.write_text(text[:start] + replacement + text[end+1:], encoding='utf-8')

          run = Path('scripts/run_update.py')
          rtext = run.read_text(encoding='utf-8')
          marker = '    text = HTML.read_text(encoding="utf-8")\n'
          audit = '''    required_job_modules = ["dagpenge", "graduates", "earlyTalks", "benefitConsumption", "survival", "statusAfter3m"]
              missing_modules = {}
              for code, fund in funds.items():
                  missing = [key for key in required_job_modules if not fund.get("jobindsats", {}).get(key)]
                  if missing:
                      missing_modules[code] = missing
              if missing_modules:
                  details = "; ".join(f"{code}: {','.join(keys)}" for code, keys in missing_modules.items())
                  raise RuntimeError(f"Manglende Jobindsats-moduler pr. a-kasse: {details}")
          '''
          if 'required_job_modules = [' not in rtext:
              if marker not in rtext:
                  raise SystemExit('Kunne ikke finde valideringspunkt i run_update.py')
              rtext = rtext.replace(marker, audit + marker)
              run.write_text(rtext, encoding='utf-8')
          PY
          python -m py_compile scripts/fetch_sources.py scripts/run_update.py
          git config user.name "Dashboard maintenance"
          git config user.email "dashboard-maintenance@users.noreply.github.com"
          git add scripts/fetch_sources.py scripts/run_update.py
          if git diff --cached --quiet; then
            echo "Ingen rettelse noedvendig"
          else
            git commit -m "Ret a-kasse mapping og valider datadaekning"
            git push
          fi

name: Valider opbrugt dagpengeret på gren

# Midlertidig valideringskørsel for grenen fix/opbrugt-dagpengeret-grupper.
# Kører de samme trin som "Opdater A-kasseindsigt", men publicerer ikke til main.
# Resultatet gemmes kun på grenen under status/branch-validation/.

on:
  push:
    branches: [fix/opbrugt-dagpengeret-grupper]
    paths-ignore:
      - status/branch-validation/**

permissions:
  contents: write

concurrency:
  group: a-kasseindsigt-branch-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kør dashboardets opdateringstrin uden publicering
        id: update
        shell: bash
        run: |
          mkdir -p status/branch-validation
          log=status/branch-validation/run.log
          set +e
          python -m py_compile scripts/statbank_api.py scripts/jobindsats_api.py scripts/fetch_sources.py scripts/jobindsats_patch.py scripts/completed_duration.py scripts/fetch_regions.py scripts/fetch_jobindsats_regions.py scripts/run_regional_jobindsats.py scripts/validate_regions.py scripts/patch_ui.py scripts/apply_dak_names.py scripts/run_update.py scripts/validate_dashboard_repo.py > "$log" 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then node --check assets/personal-view.js >> "$log" 2>&1 && node --check assets/dashboard-experience.js >> "$log" 2>&1; code=$?; fi
          if [ "$code" -eq 0 ]; then python scripts/patch_ui.py >> "$log" 2>&1; code=$?; fi
          if [ "$code" -eq 0 ]; then python scripts/run_update.py >> "$log" 2>&1; code=$?; fi
          if [ "$code" -eq 0 ]; then python scripts/fetch_regions.py >> "$log" 2>&1; code=$?; fi
          if [ "$code" -eq 0 ]; then python scripts/run_regional_jobindsats.py >> "$log" 2>&1; code=$?; fi
          if [ "$code" -eq 0 ]; then python scripts/validate_regions.py >> "$log" 2>&1; code=$?; fi
          if [ "$code" -eq 0 ]; then
            python scripts/validate_dashboard_repo.py --repo . --require-source AUA01 --require-source AUP03 --require-source jobDagpenge --require-source jobDimittend --require-source jobTalkForms --require-source jobAfterlon --require-source jobAfterlonContrib --require-source jobLongTerm --require-source jobExhaustedRights --require-source jobSanctions --require-source jobDagpengeforbrug --require-source jobOverlevelse --require-source jobStatusAfter --require-source jobCompletedDuration >> "$log" 2>&1
            code=$?
          fi
          python - >> "$log" 2>&1 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/dashboard-data.json").read_text(encoding="utf-8"))
          total = data["meta"]["totalFundCode"]
          summary = {"status": data["meta"]["sourceStatus"].get("jobExhaustedRights"), "funds": {}, "regions": {}}
          for code, fund in data["funds"].items():
              block = fund.get("jobindsats", {}).get("exhaustedRights", {})
              summary["funds"][code] = {
                  "name": fund.get("name"),
                  "periods": len(block.get("labels", [])),
                  "latest": block.get("labels", [None])[-1],
                  "persons": (block.get("persons") or [None])[-1],
                  "groups": {item["key"]: {"label": item["label"], "sourceLabel": item.get("sourceLabel"), "latest": item["values"][-1]} for item in block.get("categories", [])},
              }
          for path in sorted(Path("data/regions").glob("*.json")):
              region = json.loads(path.read_text(encoding="utf-8"))
              summary["regions"][path.stem] = {
                  "status": region["meta"].get("sourceStatus", {}).get("jobExhaustedRights"),
                  "unsupportedModules": region["meta"].get("unsupportedModules"),
              }
          Path("status/branch-validation/summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("I alt:", json.dumps(summary["funds"][total], ensure_ascii=False))
          PY
          echo "exit_code=$code" | tee -a "$log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"

      - name: Gem valideringsresultat på grenen
        if: always()
        shell: bash
        run: |
          printf 'exit_code: %s\ntid_utc: %s\nsha: %s\n' "${{ steps.update.outputs.exit_code }}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SHA" > status/branch-validation/result.txt
          git config user.name "Dashboard validation"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add status/branch-validation
          git commit -m "Valideringsresultat for opbrugt dagpengeret" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Marker fejl
        if: steps.update.outputs.exit_code != '0'
        shell: bash
        run: exit 1

name: Test regionale Jobindsats-data

on:
  push:
    branches: [feature/jobindsats-regioner]
    paths:
      - scripts/fetch_jobindsats_regions.py
      - scripts/fetch_regions.py
      - scripts/validate_regions.py
      - assets/personal-view.js
      - scripts/patch_ui.py
      - .github/workflows/test-jobindsats-regioner.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/fetch_jobindsats_regions.py
      - scripts/fetch_regions.py
      - scripts/validate_regions.py
      - assets/personal-view.js
      - scripts/patch_ui.py
      - .github/workflows/update-dashboard.yml
      - .github/workflows/test-jobindsats-regioner.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntakstjek
        run: |
          python -m py_compile scripts/statbank_api.py scripts/jobindsats_api.py scripts/fetch_sources.py scripts/fetch_regions.py scripts/fetch_jobindsats_regions.py scripts/validate_regions.py scripts/patch_ui.py
          node --check assets/personal-view.js
      - name: Hent regionale DST-data
        run: python scripts/fetch_regions.py
      - name: Hent regionale Jobindsats-data
        run: python scripts/fetch_jobindsats_regions.py
      - name: Valider regionerne
        run: python scripts/validate_regions.py
      - name: Test UI-patch
        run: |
          python scripts/patch_ui.py
          grep -q 'michel@klos.dk' index.html
          grep -q 'assets/personal-view.js' index.html
      - name: Vis filstoerrelser
        run: du -h data/regions/*.json

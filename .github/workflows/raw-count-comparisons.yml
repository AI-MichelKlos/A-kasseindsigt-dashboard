name: Udvid sammenligning i antal-grafer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/raw-count-comparisons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tilfoej konkrete sammenlignings-a-kasser til antal-grafer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          original = text

          old = "function compareCodes(){const selected=$('fundSelect').value;return [...document.querySelectorAll('.compareCheck:checked')].map(x=>x.value).filter(code=>code!==selected&&DATA.funds[code])}function fund(){return DATA.funds[$('fundSelect').value]}"
          new = "function compareCodes(){const selected=$('fundSelect').value;return [...document.querySelectorAll('.compareCheck:checked')].map(x=>x.value).filter(code=>code!==selected&&DATA.funds[code])}function rawCompareCodes(){const total=DATA.meta.totalFundCode;return compareCodes().filter(code=>code!==total)}function fund(){return DATA.funds[$('fundSelect').value]}"
          if old not in text:
              raise RuntimeError('Kunne ikke finde compareCodes-funktionen')
          text = text.replace(old, new, 1)

          old = "function singleTime(k,id,s,key,label,percent=false,beginZero=false){if(!s?.labels?.length){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(s,key,n);lineChart(k,id,w.labels,[{label,data:w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.5,tension:.18,spanGaps:false}],percent,beginZero)}function compareTime(k,id,selected,selectedKey,percent=false,index=false,beginZero=false){"
          new = "function singleTime(k,id,s,key,label,percent=false,beginZero=false){if(!s?.labels?.length){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(s,key,n);lineChart(k,id,w.labels,[{label,data:w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.5,tension:.18,spanGaps:false}],percent,beginZero)}function rawMemberTime(k,id){const f=fund(),a=f?.members;if(!a?.labels?.length){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(a,'values',n),sets=[{label:f.name,data:w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.6,tension:.18,spanGaps:false}];rawCompareCodes().forEach((code,i)=>{const b=DATA.funds[code]?.members;if(!b)return;sets.push({label:DATA.funds[code].name,data:mapValues(b,'values',w.labels),borderColor:color(i),backgroundColor:color(i),pointRadius:0,borderWidth:2,tension:.18,spanGaps:false})});lineChart(k,id,w.labels,sets,false,false)}function rawJobTime(k,id,moduleKey,field,beginZero=false){const f=fund(),a=f?.jobindsats?.[moduleKey];if(!a?.labels?.length){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(a,field,n),sets=[{label:f.name,data:w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.6,tension:.18,spanGaps:false}];rawCompareCodes().forEach((code,i)=>{const b=DATA.funds[code]?.jobindsats?.[moduleKey];if(!b)return;sets.push({label:DATA.funds[code].name,data:mapValues(b,field,w.labels),borderColor:color(i),backgroundColor:color(i),pointRadius:0,borderWidth:2,tension:.18,spanGaps:false})});lineChart(k,id,w.labels,sets,false,beginZero)}function compareTime(k,id,selected,selectedKey,percent=false,index=false,beginZero=false){"
          if old not in text:
              raise RuntimeError('Kunne ikke finde singleTime/compareTime-ankeret')
          text = text.replace(old, new, 1)

          replacements = {
              "singleTime('mr','membersRawChart',f.members,'values',f.name);": "rawMemberTime('mr','membersRawChart');",
              "singleTime('lr','longRawChart',f.jobindsats?.longTerm,'persons',f.name);": "rawJobTime('lr','longRawChart','longTerm','persons');",
              "singleTime('d','dagChart',f.jobindsats?.dagpenge,'persons',f.name,false,true);": "rawJobTime('d','dagChart','dagpenge','persons',true);",
              "singleTime('gc','gradCountChart',f.jobindsats?.graduates,'persons',f.name,false,true);": "rawJobTime('gc','gradCountChart','graduates','persons',true);",
              "singleTime('ex','exhaustedChart',f.jobindsats?.exhaustedRights,'persons',f.name,false,true);": "rawJobTime('ex','exhaustedChart','exhaustedRights','persons',true);",
              "Faktisk antal forsikringsaktive i den valgte a-kasse.": "Faktisk antal forsikringsaktive i den valgte a-kasse. Konkrete a-kasser valgt under Sammenlign med vises også; I alt vises kun i indeksgrafen.",
              "Faktisk antal langtidsledige personer i den valgte a-kasse.": "Faktisk antal langtidsledige personer i den valgte a-kasse. Konkrete a-kasser valgt under Sammenlign med vises også; I alt vises kun i indeksgrafen.",
              "Faktisk antal dagpengemodtagere i den valgte a-kasse. Der anvendes ikke indeks.": "Faktisk antal dagpengemodtagere i den valgte a-kasse. Konkrete a-kasser valgt under Sammenlign med vises også; I alt vises ikke i denne antal-graf.",
              "Faktisk antal dimittendledige i den valgte a-kasse.": "Faktisk antal dimittendledige i den valgte a-kasse. Konkrete a-kasser valgt under Sammenlign med vises også; I alt vises ikke i denne antal-graf.",
              "Antal personer i den valgte a-kasse, der opbruger retten til dagpenge i måneden.": "Antal personer i den valgte a-kasse, der opbruger retten til dagpenge i måneden. Konkrete a-kasser valgt under Sammenlign med vises også; I alt vises ikke i denne antal-graf."
          }
          for old_text, new_text in replacements.items():
              if old_text not in text:
                  raise RuntimeError(f'Manglende anker: {old_text}')
              text = text.replace(old_text, new_text, 1)

          if text == original:
              raise RuntimeError('Ingen aendringer blev anvendt')
          if "function rawCompareCodes()" not in text or "rawJobTime('ex','exhaustedChart','exhaustedRights','persons',true)" not in text:
              raise RuntimeError('Sammenligningslogikken er ikke komplet')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Kontroller JavaScript og grafer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>\s*(let DATA=.*?)</script>', text, re.S)
          if not m:
              raise SystemExit('Kunne ikke udtraekke dashboardets JavaScript')
          Path('/tmp/dashboard.js').write_text(m.group(1), encoding='utf-8')
          required = [
              "rawMemberTime('mr','membersRawChart')",
              "rawJobTime('lr','longRawChart','longTerm','persons')",
              "rawJobTime('d','dagChart','dagpenge','persons',true)",
              "rawJobTime('gc','gradCountChart','graduates','persons',true)",
              "rawJobTime('ex','exhaustedChart','exhaustedRights','persons',true)",
              "return compareCodes().filter(code=>code!==total)"
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('Mangler: ' + marker)
          PY
          node --check /tmp/dashboard.js
      - name: Gem aendringen
        shell: bash
        run: |
          git config user.name "ChatGPT dashboard update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html
          git commit -m "Vis valgte a-kasser i antal-grafer"
          git push origin HEAD:main

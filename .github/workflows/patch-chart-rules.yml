name: Ret grafregler og kilder

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-chart-rules.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ret dashboardvisning og validering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Gør navnemapping robust også mod de endelige DAK-visningsnavne.
          p=Path('scripts/fetch_sources.py')
          text=p.read_text(encoding='utf-8')
          anchors={
              '        "borne og ungdomspaedagoger bupl": "bupl",\n': '        "borne og ungdomspaedagoger bupl": "bupl",\n        "borne og ungdomspaedagogernes landsdaekkende": "bupl",\n',
              '        "journalistik komm og sprog": "jks",\n': '        "journalistik komm og sprog": "jks",\n        "for journalistik kommunikation sprog": "jks",\n',
          }
          for old,new in anchors.items():
              if old not in text:
                  raise RuntimeError(f'Mangler alias-anker: {old!r}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # 2) Skærp datavalidering for langtidsledighed i standardperioden.
          p=Path('scripts/run_update.py')
          text=p.read_text(encoding='utf-8')
          marker='''    total_jobs = total.get("jobindsats", {})\n    period_checks = [\n'''
          validation='''    # Langtidsledighed skal være komplet i standardvisningen (36 måneder)\n    # for alle aktive a-kasser. Vi udfylder aldrig manglende kildeværdier med 0.\n    expected_long = total.get("jobindsats", {}).get("longTerm", {})\n    expected_labels = expected_long.get("labels", [])[-36:]\n    if len(expected_labels) < 36:\n        raise RuntimeError(f"Langtidsledighed har kun {len(expected_labels)} måneder; forventer mindst 36")\n    long_errors = []\n    for code, fund in funds.items():\n        block = fund.get("jobindsats", {}).get("longTerm", {})\n        labels = block.get("labels", [])\n        values = block.get("persons", [])\n        if len(labels) != len(values):\n            long_errors.append(f"{code}: labels/værdier har forskellig længde")\n            continue\n        lookup = dict(zip(labels, values))\n        missing = [period for period in expected_labels if lookup.get(period) is None]\n        if missing:\n            long_errors.append(f"{code}: mangler {','.join(missing)}")\n    if long_errors:\n        raise RuntimeError("Ufuldstændig langtidsledighed: " + "; ".join(long_errors))\n\n'''
          if marker not in text:
              raise RuntimeError('Kunne ikke finde valideringsanker i run_update.py')
          text=text.replace(marker,validation+marker,1)
          p.write_text(text,encoding='utf-8')

          # 3) Visningsregler og præcise kilder.
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          original=text

          # Legend/forklaring altid over grafen.
          text=text.replace("plugins:{legend:{position:'bottom'}}", "plugins:{legend:{position:'top',align:'start'}}")

          # Gør reelle datagab synlige; forbind dem ikke kunstigt.
          text=text.replace('spanGaps:true','spanGaps:false')

          # beginAtZero kan styres pr. linjegraf.
          old="function singleTime(k,id,s,key,label,percent=false){if(!s?.labels?.length){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(s,key,n);lineChart(k,id,w.labels,[{label,data:w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.5,tension:.18,spanGaps:false}],percent,false)}"
          new="function singleTime(k,id,s,key,label,percent=false,beginZero=false){if(!s?.labels?.length){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(s,key,n);lineChart(k,id,w.labels,[{label,data:w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.5,tension:.18,spanGaps:false}],percent,beginZero)}"
          if old not in text: raise RuntimeError('singleTime-anker mangler')
          text=text.replace(old,new,1)

          old="function compareTime(k,id,selected,selectedKey,percent=false,index=false){if(!selected?.labels?.length){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(selected,selectedKey,n),sets=[];sets.push({label:fund().name,data:index?indexed(w.values):w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.6,tension:.18,spanGaps:false});compareCodes().forEach((code,i)=>{const item=DATA.funds[code],source=selected===fund().members?item.members:selected===fund().unemploymentRate?item.unemploymentRate:null;if(!source)return;const vals=mapValues(source,selectedKey,w.labels);sets.push({label:item.name,data:index?indexed(vals):vals,borderColor:color(i),backgroundColor:color(i),pointRadius:0,borderWidth:2,tension:.18,spanGaps:false})});lineChart(k,id,w.labels,sets,percent,false)}"
          new="function compareTime(k,id,selected,selectedKey,percent=false,index=false,beginZero=false){if(!selected?.labels?.length){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(selected,selectedKey,n),sets=[];sets.push({label:fund().name,data:index?indexed(w.values):w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.6,tension:.18,spanGaps:false});compareCodes().forEach((code,i)=>{const item=DATA.funds[code],source=selected===fund().members?item.members:selected===fund().unemploymentRate?item.unemploymentRate:null;if(!source)return;const vals=mapValues(source,selectedKey,w.labels);sets.push({label:item.name,data:index?indexed(vals):vals,borderColor:color(i),backgroundColor:color(i),pointRadius:0,borderWidth:2,tension:.18,spanGaps:false})});lineChart(k,id,w.labels,sets,percent,beginZero)}"
          if old not in text: raise RuntimeError('compareTime-anker mangler')
          text=text.replace(old,new,1)

          old="function compareJobTime(k,id,moduleKey,field,percent=false,index=false){const f=fund(),a=f?.jobindsats?.[moduleKey];if(!a){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(a,field,n),sets=[{label:f.name,data:index?indexed(w.values):w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.6,tension:.18,spanGaps:false}];compareCodes().forEach((code,i)=>{const b=DATA.funds[code]?.jobindsats?.[moduleKey];if(!b)return;const vals=mapValues(b,field,w.labels);sets.push({label:DATA.funds[code].name,data:index?indexed(vals):vals,borderColor:color(i),backgroundColor:color(i),pointRadius:0,borderWidth:2,tension:.18,spanGaps:false})});lineChart(k,id,w.labels,sets,percent,false)}"
          new="function compareJobTime(k,id,moduleKey,field,percent=false,index=false,beginZero=false){const f=fund(),a=f?.jobindsats?.[moduleKey];if(!a){missing(id.replace('Chart','Wrap'));return}const n=+$('periodSelect').value,w=seriesWindow(a,field,n),sets=[{label:f.name,data:index?indexed(w.values):w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.6,tension:.18,spanGaps:false}];compareCodes().forEach((code,i)=>{const b=DATA.funds[code]?.jobindsats?.[moduleKey];if(!b)return;const vals=mapValues(b,field,w.labels);sets.push({label:DATA.funds[code].name,data:index?indexed(vals):vals,borderColor:color(i),backgroundColor:color(i),pointRadius:0,borderWidth:2,tension:.18,spanGaps:false})});lineChart(k,id,w.labels,sets,percent,beginZero)}"
          if old not in text: raise RuntimeError('compareJobTime-anker mangler')
          text=text.replace(old,new,1)

          draw_repls={
              "compareTime('u','unempChart',f.unemploymentRate,'values',true,false);":"compareTime('u','unempChart',f.unemploymentRate,'values',true,false,true);",
              "singleTime('d','dagChart',f.jobindsats?.dagpenge,'persons',f.name);":"singleTime('d','dagChart',f.jobindsats?.dagpenge,'persons',f.name,false,true);",
              "singleTime('gc','gradCountChart',f.jobindsats?.graduates,'persons',f.name);":"singleTime('gc','gradCountChart',f.jobindsats?.graduates,'persons',f.name,false,true);",
              "compareJobTime('gs','gradChart','graduates','share',true,false);":"compareJobTime('gs','gradChart','graduates','share',true,false,true);",
              "singleTime('ex','exhaustedChart',f.jobindsats?.exhaustedRights,'persons',f.name);":"singleTime('ex','exhaustedChart',f.jobindsats?.exhaustedRights,'persons',f.name,false,true);",
          }
          for old,new in draw_repls.items():
              if old not in text: raise RuntimeError(f'Mangler draw-anker: {old}')
              text=text.replace(old,new,1)

          # Forklaring over indeksgrafen for langtidsledighed.
          old='<div class="card"><h3>Langtidsledige, indeks 100</h3><div class="desc">Sammenligner udviklingen i langtidsledighed. Første viste periode = 100.</div><div id="longIndexWrap" class="chart">'
          new='<div class="card"><h3>Langtidsledige, indeks 100</h3><div class="desc">Sammenligner udviklingen i langtidsledighed. Første viste periode = 100.</div><div class="explain"><strong>Hvad måles:</strong> Samme Jobindsats-serie som i grafen med antal, omregnet til indeks 100 i den første viste måned. I alt er standard-sammenligning; flere a-kasser kan tilføjes.</div><div id="longIndexWrap" class="chart">'
          if old not in text: raise RuntimeError('Langtidsindeks-anker mangler')
          text=text.replace(old,new,1)

          # Kilder: DST som forkortelse og præcis Jobindsats-måling.
          source_repls={
              '>Danmarks Statistik, AUA01</a>':'>DST – Forsikringsaktive (AUA01)</a>',
              '>Danmarks Statistik, AUP03</a>':'>DST – Fuldtidsledige i pct. af samtlige forsikrede (AUP03)</a>',
              '>Jobindsats.dk / STAR</a></span><span id="sLong"':'>Jobindsats.dk – Antal langtidsledige personer</a></span><span id="sLong"',
              '>Jobindsats.dk / STAR</a></span><span id="sLong2"':'>Jobindsats.dk – Antal langtidsledige personer</a></span><span id="sLong2"',
              '<div class="source"><span>Kilde: Jobindsats.dk / STAR</span><span id="sDag"></span></div>':'<div class="source"><span>Kilde: <a href="https://jobindsats.dk/information/om-malinger/om-ydelser/om-a-dagpenge/om-antal-personer-og-fuldtidspersoner/" target="_blank" rel="noopener">Jobindsats.dk – Antal personer og fuldtidspersoner</a></span><span id="sDag"></span></div>',
              '<div class="source"><span>Kilde: Jobindsats.dk / STAR</span><span id="sGradCount"></span></div>':'<div class="source"><span>Kilde: <a href="https://jobindsats.dk/information/om-malinger/om-ydelser/om-a-dagpenge/om-antal-dimittendledige-personer/" target="_blank" rel="noopener">Jobindsats.dk – Antal dimittendledige personer</a></span><span id="sGradCount"></span></div>',
              '<div class="source"><span>Kilde: Jobindsats.dk / STAR</span><span id="sGrad"></span></div>':'<div class="source"><span>Kilde: <a href="https://jobindsats.dk/information/om-malinger/om-ydelser/om-a-dagpenge/om-antal-dimittendledige-personer/" target="_blank" rel="noopener">Jobindsats.dk – Antal dimittendledige personer</a></span><span id="sGrad"></span></div>',
              '>Jobindsats.dk / STAR</a></span><span id="sCons"':'>Jobindsats.dk – Antal personer med forbrug af dagpengeperioden</a></span><span id="sCons"',
              '>Jobindsats.dk / STAR</a></span><span id="sExhausted"':'>Jobindsats.dk – Personer med opbrugt dagpengeret fordelt på dimittender og øvrige ledige</a></span><span id="sExhausted"',
              '>Jobindsats.dk / STAR</a></span><span id="sSurv"':'>Jobindsats.dk – Overlevelseskurver</a></span><span id="sSurv"',
              '>Jobindsats.dk / STAR</a></span><span id="sStatus"':'>Jobindsats.dk – Arbejdsmarkedsstatus 1, 3, 6 og 12 mdr. efter afsluttet forløb</a></span><span id="sStatus"',
              '>Jobindsats.dk / STAR</a></span><span id="sTalk"':'>Jobindsats.dk – Tidlig indsats: Jobsamtaler til a-dagpengemodtagere i a-kasserne</a></span><span id="sTalk"',
          }
          for old,new in source_repls.items():
              if old not in text:
                  raise RuntimeError(f'Mangler kilde-anker: {old}')
              text=text.replace(old,new)

          if text==original:
              raise RuntimeError('Ingen HTML-ændringer anvendt')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Kontroller kode og HTML
        shell: bash
        run: |
          python -m py_compile scripts/fetch_sources.py scripts/run_update.py
          grep -Fq "position:'top',align:'start'" index.html
          grep -Fq 'DST – Forsikringsaktive (AUA01)' index.html
          grep -Fq 'Jobindsats.dk – Antal langtidsledige personer' index.html
          grep -Fq 'Ufuldstændig langtidsledighed' scripts/run_update.py
          grep -Fq 'borne og ungdomspaedagogernes landsdaekkende' scripts/fetch_sources.py
      - name: Gem ændringer og fjern midlertidige workflows
        shell: bash
        run: |
          rm -f .github/workflows/diagnose-longterm.yml .github/workflows/patch-chart-rules.yml
          git config user.name "ChatGPT dashboard update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html scripts/fetch_sources.py scripts/run_update.py .github/workflows/diagnose-longterm.yml .github/workflows/patch-chart-rules.yml
          git commit -m "Ret grafregler, kilder og langtidsvalidering"
          git push origin HEAD:main

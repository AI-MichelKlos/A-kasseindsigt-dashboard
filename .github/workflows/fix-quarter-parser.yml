name: Ret kvartalsparser

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-quarter-parser.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ret kvartalsformat
        run: python tools/fix_quarter_parser.py
      - name: Kontroller og gem
        shell: bash
        run: |
          python -m py_compile scripts/jobindsats_patch.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from jobindsats_patch import pkey
          assert pkey('2026Q01') == (2026,3)
          assert pkey('2025Q04') == (2025,12)
          assert pkey('2026Q1') == (2026,3)
          PY
          git config user.name "ChatGPT dashboard update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add scripts/jobindsats_patch.py
          git commit -m "Ret sortering af kvartalsperioder"
          git push origin HEAD:main

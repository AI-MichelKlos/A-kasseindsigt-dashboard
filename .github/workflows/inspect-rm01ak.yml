name: Undersøg ny resultatmåling
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - inspect_rm01ak.py
      - .github/workflows/inspect-rm01ak.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python inspect_rm01ak.py

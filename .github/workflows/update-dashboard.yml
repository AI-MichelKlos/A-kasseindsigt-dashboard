name: Opdater A-kasseindsigt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/**
      - config/**
      - .github/workflows/update-dashboard.yml
      - README.md
      - .nojekyll
  schedule:
    - cron: "17 7-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: a-kasseindsigt-update
  cancel-in-progress: false

jobs:
  discover_jobsearch:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run jobsearch source discovery'
    runs-on: ubuntu-24.04
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soeg Jobindsats API efter jobsoegningsdata
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          token = os.environ.get('JOBINDSATS_API_TOKEN')
          if not token:
              raise SystemExit('API_ADGANG mangler')

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'Danske-A-kasser-jobsearch-discovery/1.0',
              })
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          tables = get('https://api.jobindsats.dk/v3/tables?format=json')
          keywords = ('jobsøg', 'jobsoeg', 'joblog', 'jobansøg', 'jobansog', 'jobsøgn', 'jobsogn')

          def text_of(obj):
              if isinstance(obj, dict):
                  return ' '.join(text_of(v) for v in obj.values())
              if isinstance(obj, list):
                  return ' '.join(text_of(v) for v in obj)
              return str(obj)

          def candidate_dicts(obj):
              if isinstance(obj, dict):
                  yield obj
                  for v in obj.values():
                      yield from candidate_dicts(v)
              elif isinstance(obj, list):
                  for v in obj:
                      yield from candidate_dicts(v)

          matches = []
          seen = set()
          for d in candidate_dicts(tables):
              low = text_of(d).lower()
              if any(k in low for k in keywords):
                  marker = json.dumps(d, ensure_ascii=False, sort_keys=True)
                  if marker not in seen:
                      seen.add(marker)
                      matches.append(d)

          ids = []
          for d in matches:
              for key in ('table_id','tableId','id'):
                  val = d.get(key) if isinstance(d, dict) else None
                  if isinstance(val, str) and re.fullmatch(r'[A-Za-z0-9_-]+', val) and val not in ids:
                      ids.append(val)

          specs = {}
          for table_id in ids[:20]:
              try:
                  specs[table_id] = get(f'https://api.jobindsats.dk/v3/table/{table_id}?format=json')
              except Exception as exc:
                  specs[table_id] = {'error': type(exc).__name__, 'message': str(exc)[:300]}

          out = {
              'keywords': list(keywords),
              'match_count': len(matches),
              'candidate_table_ids': ids[:20],
              'matches': matches[:60],
              'specs': specs,
          }
          Path('status').mkdir(exist_ok=True)
          Path('status/jobsearch-api-discovery.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('match_count=', len(matches))
          print('candidate_table_ids=', ids[:20])
          PY
      - name: Gem diagnose
        shell: bash
        run: |
          git config user.name "Dashboard source discovery"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add status/jobsearch-api-discovery.json
          git commit -m "Gem Jobindsats jobsoegningskilde-diagnose"
          git push origin HEAD:main

  update:
    runs-on: ubuntu-24.04
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4

      - name: Afgoer om dagens opdatering skal koere
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.head_commit.message }}" = "Run jobsearch source discovery" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(TZ=Europe/Copenhagen date +'%F')"
          local_hour="$(TZ=Europe/Copenhagen date +'%H')"
          local_hour=$((10#$local_hour))
          if [ "$local_hour" -lt 9 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif grep -Fxq "status: ok" status/last-run.txt 2>/dev/null && grep -Fxq "dato_dk: $today" status/last-run.txt 2>/dev/null; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Hent officielle data og valider
        if: steps.gate.outputs.should_run == 'true'
        id: update
        shell: bash
        run: |
          mkdir -p status
          set +e
          python -m py_compile scripts/statbank_api.py scripts/jobindsats_api.py scripts/fetch_sources.py scripts/jobindsats_patch.py scripts/apply_dak_names.py scripts/run_update.py scripts/validate_dashboard_repo.py > status/run.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python scripts/run_update.py >> status/run.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python scripts/validate_dashboard_repo.py --repo . --require-source AUA01 --require-source AUP03 --require-source jobDagpenge --require-source jobDimittend --require-source jobEarlyTalks --require-source jobLongTerm --require-source jobExhaustedRights --require-source jobSanctions --require-source jobDagpengeforbrug --require-source jobOverlevelse --require-source jobStatusAfter >> status/run.log 2>&1
            code=$?
          fi
          cat status/run.log || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Skriv driftsspor
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          today="$(TZ=Europe/Copenhagen date +'%F')"
          utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          code="${{ steps.update.outputs.exit_code }}"
          if [ "$code" = "0" ]; then
            state="$(python -c "import json; print(json.load(open('data/dashboard-data.json'))['meta']['updateStatus']['state'])")"
            printf 'status: %s\ntid_utc: %s\ndato_dk: %s\n' "$state" "$utc" "$today" > status/last-run.txt
          else
            message="$(tail -n 12 status/run.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
            printf 'status: fejl\ntid_utc: %s\ndato_dk: %s\nfejl: %s\n' "$utc" "$today" "$message" > status/last-run.txt
          fi

      - name: Gem godkendte data eller kun fejlstatus
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          code="${{ steps.update.outputs.exit_code }}"
          cp status/last-run.txt /tmp/last-run.txt
          if [ "$code" = "0" ]; then
            cp data/dashboard-data.json /tmp/dashboard-data.json
          fi
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/last-run.txt status/last-run.txt
          git add status/last-run.txt
          if [ "$code" = "0" ]; then
            cp /tmp/dashboard-data.json data/dashboard-data.json
            git add data/dashboard-data.json
          fi
          if git diff --cached --quiet; then
            echo "Ingen aendringer at gemme."
          else
            git config user.name "Dashboard automation"
            git config user.email "dashboard-automation@users.noreply.github.com"
            if [ "$code" = "0" ]; then
              git commit -m "Opdater A-kasseindsigt data og status"
            else
              git commit -m "Registrer fejl i A-kasseindsigt opdatering"
            fi
            git push origin HEAD:main
          fi

      - name: Marker reel opdateringsfejl
        if: steps.gate.outputs.should_run == 'true' && steps.update.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.update.outputs.exit_code }}"
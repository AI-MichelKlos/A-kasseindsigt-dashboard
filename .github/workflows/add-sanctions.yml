name: Tilføj rådighedssanktioner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-sanctions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Udvid datakæde og dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Jobindsats-hentning
          p = Path('scripts/jobindsats_patch.py')
          text = p.read_text(encoding='utf-8')
          anchor = '\ndef consumption(data):\n'
          if anchor not in text:
              raise RuntimeError('Mangler anchor til sanctions-funktion')
          sanctions = r'''

def sanctions(data):
    table = "y01h01"
    spec, fund_h, selection = setup(table)
    rows = ji.query(table, spec, "latest:40", ((fund_h, selection),))
    fcol = exact_col(rows, "A-kasse") or ji.best_col(rows, ["a kasse"], distinct=True)
    pcol = exact_col(rows, "Periode") or ji.best_col(rows, ["periode"], distinct=True)
    cols = {
        "total": exact_col(rows, "Antal sanktioner i alt"),
        "excluded": exact_col(rows, "Antal sanktioner fordelt på type: Udelukkes fra dagpenge i en periode"),
        "quarantine": exact_col(rows, "Antal sanktioner fordelt på type: Karantæne (selvforskyldt ledighed)"),
        "repeat": exact_col(rows, "Antal sanktioner fordelt på type: Gentagelsesvirkning (arbejdskrav)"),
        "other": exact_col(rows, "Antal sanktioner fordelt på type: Andre (arbejdskrav)"),
        "share": exact_col(rows, "Andel sanktionerede ledige"),
        "avg": exact_col(rows, "Gnsn. antal sanktioner pr. sanktioneret ledig"),
    }
    missing = [key for key, col in cols.items() if not col]
    if missing:
        raise RuntimeError(f"Sanktionstabellen mangler kolonner: {missing}; har {ji.columns(rows)}")

    grouped = defaultdict(dict)
    for row in rows:
        code = fund_code(row.get(fcol), data)
        period = str(row.get(pcol) or "")
        if code not in data["funds"] or not period:
            continue
        grouped[code][period] = {
            "total": ji.number(row.get(cols["total"])),
            "share": ji.number(row.get(cols["share"])),
            "avg": ji.number(row.get(cols["avg"])),
            "excluded": ji.number(row.get(cols["excluded"])),
            "quarantine": ji.number(row.get(cols["quarantine"])),
            "repeat": ji.number(row.get(cols["repeat"])),
            "other": ji.number(row.get(cols["other"])),
        }
    if not grouped:
        raise RuntimeError("Rådighedssanktioner gav ingen a-kassedata")

    type_defs = [
        ("Udelukkelse fra dagpenge i en periode", "excluded"),
        ("Karantæne (selvforskyldt ledighed)", "quarantine"),
        ("Gentagelsesvirkning (arbejdskrav)", "repeat"),
        ("Andre arbejdskrav", "other"),
    ]
    for code, values in grouped.items():
        labels = sorted(values, key=pkey)
        data["funds"][code]["jobindsats"]["sanctions"] = {
            "labels": labels,
            "total": [values[p]["total"] for p in labels],
            "shareSanctioned": [values[p]["share"] for p in labels],
            "avgPerSanctioned": [values[p]["avg"] for p in labels],
            "types": [
                {"label": label, "values": [values[p][key] for p in labels]}
                for label, key in type_defs
            ],
        }

    latest = max((period for values in grouped.values() for period in values), key=pkey)
    total_code = data["meta"]["totalFundCode"]
    total_block = data["funds"].get(total_code, {}).get("jobindsats", {}).get("sanctions", {})
    if not total_block.get("labels") or total_block["labels"][-1] != latest:
        raise RuntimeError("Sanktioner mangler seneste kvartal for I alt")
    if total_block.get("total", [None])[-1] is None:
        raise RuntimeError("Seneste samlede antal rådighedssanktioner er tomt")

    put_status(
        data,
        "jobSanctions",
        table,
        latest,
        "antal rådighedssanktioner, pct. sanktionerede og gennemsnit pr. sanktioneret ledig",
        "Databrud: 2019-2020 omfatter kun bestemte sager rejst via jobcentrene; fra 1. kvt. 2021 indgår også sager rejst af a-kasserne selv.",
    )
'''
          text = text.replace(anchor, sanctions + anchor, 1)
          jobs_anchor = '        ("jobExhaustedRights", exhausted_rights),\n        ("jobDagpengeforbrug", consumption),'
          if jobs_anchor not in text:
              raise RuntimeError('Mangler jobs-anchor')
          text = text.replace(jobs_anchor, '        ("jobExhaustedRights", exhausted_rights),\n        ("jobSanctions", sanctions),\n        ("jobDagpengeforbrug", consumption),', 1)
          method_anchor = '        "Langtidsledighed hentes fra Jobindsats og afgrænses til a-dagpenge.",\n'
          if method_anchor not in text:
              raise RuntimeError('Mangler methodNotes-anchor')
          text = text.replace(method_anchor, method_anchor + '        "Rådighedssanktioner hentes kvartalsvist fra Jobindsats. Der er databrud fra 1. kvt. 2021, hvor sager rejst af a-kasserne selv også indgår.",\n', 1)
          p.write_text(text, encoding='utf-8')

          # 2) Projektspecifik validering
          p = Path('scripts/run_update.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('        "jobExhaustedRights",\n        "jobDagpengeforbrug",', '        "jobExhaustedRights",\n        "jobSanctions",\n        "jobDagpengeforbrug",', 1)
          text = text.replace('        "exhaustedRights",\n        "benefitConsumption",', '        "exhaustedRights",\n        "sanctions",\n        "benefitConsumption",', 1)
          text = text.replace('        ("exhaustedRights", "labels", "jobExhaustedRights"),\n        ("benefitConsumption",', '        ("exhaustedRights", "labels", "jobExhaustedRights"),\n        ("sanctions", "labels", "jobSanctions"),\n        ("benefitConsumption",', 1)
          html_anchor = '        \'id="talkPeriodText"\',\n        \'Mindst 3 samtaler\','
          if html_anchor not in text:
              raise RuntimeError('Mangler HTML-valideringsanchor')
          text = text.replace(html_anchor, '        \'id="talkPeriodText"\',\n        \'id="sanctionsTotalChart"\',\n        \'id="sanctionsShareChart"\',\n        \'id="sanctionsTypeChart"\',\n        \'id="sanctionsAvgChart"\',\n        \'id="sanctionsPeriodText"\',\n        \'Mindst 3 samtaler\',', 1)
          # Kvalitetsport for de seneste 12 kvartaler i standardvisningen.
          insert_anchor = '    total_jobs = total.get("jobindsats", {})\n'
          if insert_anchor not in text:
              raise RuntimeError('Mangler sanctions-valideringsanchor')
          validation = r'''    # Rådighedssanktioner er kvartalsvise: 3 års standardvisning = 12 kvartaler.
    sanctions_total = total.get("jobindsats", {}).get("sanctions", {})
    sanctions_labels = sanctions_total.get("labels", [])[-12:]
    if len(sanctions_labels) < 12:
        raise RuntimeError(f"Rådighedssanktioner har kun {len(sanctions_labels)} kvartaler; forventer mindst 12")
    sanctions_errors = []
    for code, fund in funds.items():
        block = fund.get("jobindsats", {}).get("sanctions", {})
        labels = block.get("labels", [])
        totals = block.get("total", [])
        shares = block.get("shareSanctioned", [])
        avgs = block.get("avgPerSanctioned", [])
        if not (len(labels) == len(totals) == len(shares) == len(avgs)):
            sanctions_errors.append(f"{code}: uens længde på sanktionstidsserier")
            continue
        lookup_total = dict(zip(labels, totals))
        lookup_share = dict(zip(labels, shares))
        missing = [p for p in sanctions_labels if lookup_total.get(p) is None or lookup_share.get(p) is None]
        if missing:
            sanctions_errors.append(f"{code}: mangler total/andel i {','.join(missing)}")
    if sanctions_errors:
        raise RuntimeError("Ufuldstændige rådighedssanktioner: " + "; ".join(sanctions_errors))

'''
          text = text.replace(insert_anchor, validation + insert_anchor, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Workflowets generelle validering
          p = Path('.github/workflows/update-dashboard.yml')
          text = p.read_text(encoding='utf-8')
          needle = '--require-source jobExhaustedRights --require-source jobDagpengeforbrug'
          if needle not in text:
              raise RuntimeError('Mangler workflow validator-anchor')
          text = text.replace(needle, '--require-source jobExhaustedRights --require-source jobSanctions --require-source jobDagpengeforbrug', 1)
          p.write_text(text, encoding='utf-8')

          # 4) Dashboard-sektion og JavaScript
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          section_anchor = '<div id="method" class="note"></div>'
          if section_anchor not in text:
              raise RuntimeError('Mangler sektion-anchor i index.html')
          section = '''<section><h2>7. Rådighedssanktioner</h2><p>Sanktioner blandt a-dagpengemodtagere, både som antal, andel, sanktionstype og gennemsnit pr. sanktioneret ledig.</p><div class="explain"><strong>Vigtig datanote:</strong> Der er et databrud fra 1. kvt. 2021. I 2019-2020 omfatter opgørelsen kun bestemte rådighedssager på baggrund af hændelser fra jobcentrene. Fra 1. kvt. 2021 indgår også sanktioner på baggrund af sager, som a-kasserne selv har rejst. Udviklingen hen over 2020/2021 bør derfor tolkes med forsigtighed. <strong>Seneste periode:</strong> <span id="sanctionsPeriodText">-</span>.</div><div class="grid"><div class="card"><h3>Rådighedssanktioner, antal</h3><div class="desc">Faktisk antal sanktioner i den valgte a-kasse pr. kvartal.</div><div class="explain"><strong>Hvad måles:</strong> Det samlede antal rådighedssanktioner. En person kan have mere end én sanktion i samme periode.</div><div id="sanctionsTotalWrap" class="chart"><canvas id="sanctionsTotalChart"></canvas></div><div class="source"><span>Kilde: <a href="https://jobindsats.dk/information/om-malinger/om-ydelser/om-a-dagpenge/a-dagpenge-antal-radighedssanktioner" target="_blank" rel="noopener">Jobindsats.dk – Antal rådighedssanktioner</a></span><span id="sSanctionsTotal"></span></div></div><div class="card"><h3>Andel sanktionerede ledige</h3><div class="desc">Andel af de ledighedsberørte dagpengemodtagere, der har fået mindst én sanktion.</div><div class="explain"><strong>Hvad måles:</strong> Procentdelen med mindst én rådighedssanktion i kvartalet. I alt er standard-sammenligning, og flere a-kasser kan tilføjes.</div><div id="sanctionsShareWrap" class="chart"><canvas id="sanctionsShareChart"></canvas></div><div class="source"><span>Kilde: <a href="https://jobindsats.dk/information/om-malinger/om-ydelser/om-a-dagpenge/a-dagpenge-antal-radighedssanktioner" target="_blank" rel="noopener">Jobindsats.dk – Antal rådighedssanktioner</a></span><span id="sSanctionsShare"></span></div></div><div class="card"><h3>Rådighedssanktioner efter type</h3><div class="desc">Fordeling på sanktionstype i seneste kvartal for den valgte a-kasse.</div><div class="explain"><strong>Sanktionstyper:</strong> Udelukkelse fra dagpenge i en periode, karantæne ved selvforskyldt ledighed, gentagelsesvirkning/arbejdskrav og andre arbejdskrav. Manglende kildeværdier vises ikke som 0.</div><div id="sanctionsTypeWrap" class="chart"><canvas id="sanctionsTypeChart"></canvas></div><div class="source"><span>Kilde: <a href="https://jobindsats.dk/information/om-malinger/om-ydelser/om-a-dagpenge/a-dagpenge-antal-radighedssanktioner" target="_blank" rel="noopener">Jobindsats.dk – Antal rådighedssanktioner</a></span><span id="sSanctionsTypes"></span></div></div><div class="card"><h3>Gns. antal sanktioner pr. sanktioneret ledig</h3><div class="desc">Hvor mange sanktioner en sanktioneret ledig i gennemsnit har fået i kvartalet.</div><div class="explain"><strong>Hvad måles:</strong> Antal sanktioner divideret med antallet af sanktionerede ledige. I alt er valgt som standard-sammenligning.</div><div id="sanctionsAvgWrap" class="chart"><canvas id="sanctionsAvgChart"></canvas></div><div class="source"><span>Kilde: <a href="https://jobindsats.dk/information/om-malinger/om-ydelser/om-a-dagpenge/a-dagpenge-antal-radighedssanktioner" target="_blank" rel="noopener">Jobindsats.dk – Antal rådighedssanktioner</a></span><span id="sSanctionsAvg"></span></div></div></div></section>\n'''
          text = text.replace(section_anchor, section + section_anchor, 1)

          # Kvartalsfunktioner: periodevælgerens 1/2/3/5/10 år omsættes til 4/8/12/20/40 kvartaler.
          js_anchor = 'function mapValues(s,key,labels)'
          if js_anchor not in text:
              raise RuntimeError('Mangler JS-anchor mapValues')
          quarter_js = '''function quarterN(){return Math.ceil(+$('periodSelect').value/3)}function singleQuarterTime(k,id,s,key,label,percent=false,beginZero=false){if(!s?.labels?.length){missing(id.replace('Chart','Wrap'));return}const w=seriesWindow(s,key,quarterN());lineChart(k,id,w.labels,[{label,data:w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.5,tension:.18,spanGaps:false}],percent,beginZero)}function compareJobQuarterTime(k,id,moduleKey,field,percent=false,beginZero=false){const f=fund(),a=f?.jobindsats?.[moduleKey];if(!a){missing(id.replace('Chart','Wrap'));return}const w=seriesWindow(a,field,quarterN()),sets=[{label:f.name,data:w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.6,tension:.18,spanGaps:false}];compareCodes().forEach((code,i)=>{const b=DATA.funds[code]?.jobindsats?.[moduleKey];if(!b)return;sets.push({label:DATA.funds[code].name,data:mapValues(b,field,w.labels),borderColor:color(i),backgroundColor:color(i),pointRadius:0,borderWidth:2,tension:.18,spanGaps:false})});lineChart(k,id,w.labels,sets,percent,beginZero)}'''
          text = text.replace(js_anchor, quarter_js + js_anchor, 1)

          missing_anchor = 'function missing(wrap)'
          if missing_anchor not in text:
              raise RuntimeError('Mangler JS-anchor missing')
          type_js = '''function sanctionTypeChart(){const f=fund(),s=f?.jobindsats?.sanctions;if(!s?.labels?.length||!Array.isArray(s.types)){missing('sanctionsTypeWrap');return}const idx=s.labels.length-1,labels=s.types.map(x=>x.label),vals=s.types.map(x=>Array.isArray(x.values)?x.values[idx]:null);barChart('sty','sanctionsTypeChart',labels,[{label:f.name,data:vals,backgroundColor:C.g,borderRadius:4}],false,true)}'''
          text = text.replace(missing_anchor, type_js + missing_anchor, 1)

          source_old = "['sTalk','jobEarlyTalks']].forEach"
          source_new = "['sTalk','jobEarlyTalks'],['sSanctionsTotal','jobSanctions'],['sSanctionsShare','jobSanctions'],['sSanctionsTypes','jobSanctions'],['sSanctionsAvg','jobSanctions']].forEach"
          if source_old not in text:
              raise RuntimeError('Mangler source-array anchor')
          text = text.replace(source_old, source_new, 1)
          period_old = "$('talkPeriodText').textContent=period(DATA.meta.sourceStatus?.jobEarlyTalks?.latestPeriod)"
          period_new = period_old + ";$('sanctionsPeriodText').textContent=period(DATA.meta.sourceStatus?.jobSanctions?.latestPeriod)"
          if period_old not in text:
              raise RuntimeError('Mangler talk period anchor')
          text = text.replace(period_old, period_new, 1)

          draw_anchor = "compareJobTime('talk','talkChart','earlyTalks','share',true,false);kpis(f);"
          if draw_anchor not in text:
              raise RuntimeError('Mangler draw-anchor')
          draw_new = "compareJobTime('talk','talkChart','earlyTalks','share',true,false);singleQuarterTime('st','sanctionsTotalChart',f.jobindsats?.sanctions,'total',f.name,false,true);compareJobQuarterTime('ss','sanctionsShareChart','sanctions','shareSanctioned',true,true);sanctionTypeChart();compareJobQuarterTime('sa','sanctionsAvgChart','sanctions','avgPerSanctioned',false,true);kpis(f);"
          text = text.replace(draw_anchor, draw_new, 1)
          p.write_text(text, encoding='utf-8')

          # 5) Kort dokumentation
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          if 'Rådighedssanktioner' not in text:
              text += '\n\n## Rådighedssanktioner\n\nSektion 7 henter Jobindsats.dk-tabellen `y01h01` (Antal rådighedssanktioner) kvartalsvist. Dashboardet viser samlet antal, andel sanktionerede ledige, sanktionstype og gennemsnitligt antal sanktioner pr. sanktioneret ledig. Der markeres databrud fra 1. kvt. 2021.\n'
          p.write_text(text, encoding='utf-8')
          PY

      - name: Kontroller syntaks og nye elementer
        shell: bash
        run: |
          python -m py_compile scripts/jobindsats_patch.py scripts/run_update.py scripts/jobindsats_api.py scripts/fetch_sources.py scripts/apply_dak_names.py scripts/validate_dashboard_repo.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          for item in ['sanctionsTotalChart','sanctionsShareChart','sanctionsTypeChart','sanctionsAvgChart','sanctionsPeriodText','Jobindsats.dk – Antal rådighedssanktioner']:
              assert item in html, item
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert scripts, 'intet inline JavaScript fundet'
          Path('/tmp/dashboard.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
          grep -Fq 'jobSanctions' scripts/run_update.py
          grep -Fq 'jobSanctions' scripts/jobindsats_patch.py
          grep -Fq -- '--require-source jobSanctions' .github/workflows/update-dashboard.yml

      - name: Gem ændringer og fjern engangsworkflow
        shell: bash
        run: |
          rm .github/workflows/add-sanctions.yml
          git config user.name "ChatGPT dashboard update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html scripts/jobindsats_patch.py scripts/run_update.py .github/workflows/update-dashboard.yml README.md .github/workflows/add-sanctions.yml
          git commit -m "Tilføj rådighedssanktioner til A-kasseindsigt"
          git push origin HEAD:main

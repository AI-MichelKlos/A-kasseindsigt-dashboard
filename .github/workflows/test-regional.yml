name: Test regional A-kasseindsigt

on:
  push:
    branches: [feature/regional-a-kasseindsigt]
    paths:
      - scripts/fetch_regions.py
      - scripts/validate_regions.py
      - assets/personal-view.js
      - .github/workflows/test-regional.yml

permissions:
  contents: read

jobs:
  test-regional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntakstjek
        run: |
          python -m py_compile scripts/statbank_api.py scripts/fetch_sources.py scripts/fetch_regions.py scripts/validate_regions.py
          node --check assets/personal-view.js
      - name: Hent regionale DST-data
        run: python scripts/fetch_regions.py
      - name: Valider regionale data
        run: python scripts/validate_regions.py
      - name: Kontroller filer og stoerrelser
        run: |
          test -s data/regions/hovedstaden.json
          test -s data/regions/sjaelland.json
          test -s data/regions/syddanmark.json
          test -s data/regions/midtjylland.json
          test -s data/regions/nordjylland.json
          du -h data/regions/*.json

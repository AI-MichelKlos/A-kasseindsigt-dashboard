name: Kontroller samtaleformer og efterloen

# Den oprindelige engangsmigration er gennemført. Workflowet bevares som
# manuel, skrivebeskyttet kontrol, så historikken og de relevante valideringer
# fortsat kan bruges uden at ændre produktionsdata.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valider dashboard og de indfoerte kilder
        run: |
          python scripts/validate_dashboard_repo.py --repo . \
            --require-source AUA01 \
            --require-source AUP03 \
            --require-source jobDagpenge \
            --require-source jobDimittend \
            --require-source jobTalkForms \
            --require-source jobAfterlon \
            --require-source jobAfterlonContrib \
            --require-source jobLongTerm \
            --require-source jobExhaustedRights \
            --require-source jobSanctions \
            --require-source jobDagpengeforbrug \
            --require-source jobOverlevelse \
            --require-source jobStatusAfter \
            --require-source jobCompletedDuration

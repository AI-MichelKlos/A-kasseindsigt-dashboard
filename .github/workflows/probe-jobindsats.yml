name: Probe Jobindsats metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_jobindsats.py
      - .github/workflows/probe-jobindsats.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe tabeller
        run: python scripts/probe_jobindsats.py

name: Generate LinkedIn chart previews

on:
  workflow_dispatch:
  schedule:
    - cron: "22 7 * * 1"
  push:
    branches: [main, feature/linkedin-sharing-verified]
    paths:
      - index.html
      - assets/**
      - config/share-charts.json
      - data/dashboard-data.json
      - data/rm01ak-summary.json
      - del/**
      - share/**
      - scripts/generate-share-previews.cjs
      - scripts/build_share_pages.py
      - scripts/test_share_pages.py
      - scripts/test_share_redirect.cjs
      - scripts/test_sharing.py
      - scripts/requirements-sharing.txt
      - scripts/patch_ui.py
      - .github/workflows/share-previews.yml
  pull_request:
    paths:
      - index.html
      - assets/**
      - config/share-charts.json
      - del/**
      - share/**
      - scripts/generate-share-previews.cjs
      - scripts/*shar*
      - scripts/patch_ui.py
      - .github/workflows/share-previews.yml
  # Data commits made with GITHUB_TOKEN do not trigger a new push workflow.
  # A completed data workflow therefore refreshes the previews separately.
  workflow_run:
    workflows: [Opdater A-kasseindsigt, Opdater resultatmåling RM01AK]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pages: write

concurrency:
  group: linkedin-sharing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-sharing.txt

      - name: Installer værktøjer til billeder og browsertest
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-sharing.txt

      - name: Byg og kontroller forhåndsbilleder fra de aktuelle data
        run: |
          python scripts/build_share_pages.py
          python scripts/build_share_pages.py --check

      - name: Kontroller kode og eksisterende figurer
        run: |
          node --check assets/personal-view.js
          node --check assets/dashboard-experience.js
          node --check assets/figure-sharing.js
          node --check assets/share-redirect.js
          node scripts/test_share_redirect.cjs
          python scripts/test_figure_counts.py
          python scripts/test_share_pages.py
          python scripts/patch_ui.py
          git diff --exit-code -- index.html

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: sharing-chromium-${{ runner.os }}-${{ hashFiles('scripts/requirements-sharing.txt') }}

      - name: Installer Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test deling, filtre og mobilvisning i en rigtig browser
        run: python scripts/test_sharing.py --artifacts /tmp/sharing-test-artifacts

      - name: Gem testrapport og skærmbilleder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharing-browser-tests
          path: /tmp/sharing-test-artifacts
          if-no-files-found: ignore

      - name: Gem kun validerede forhåndsbilleder
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/linkedin-sharing-verified') && github.event_name != 'pull_request'
        shell: bash
        env:
          SHARING_BRANCH: ${{ github.ref_name }}
        run: |
          git add del share assets/share
          if git diff --cached --quiet; then
            echo "Forhåndsbillederne svarer allerede til de aktuelle data."
            exit 0
          fi
          git config user.name "Dashboard automation"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git commit -m "Opdater validerede LinkedIn-forhåndsbilleder"
          # Preserve concurrent changes and never force-push generated files.
          git fetch origin "$SHARING_BRANCH"
          if ! git diff --quiet HEAD "origin/$SHARING_BRANCH" -- data/dashboard-data.json data/rm01ak-summary.json config/share-charts.json scripts/build_share_pages.py assets/share-redirect.js index.html assets/personal-view.js assets/dashboard-experience.js assets/figure-sharing.js assets/chart-sharing.css; then
            echo "Datagrundlaget blev ændret under testen. Nye billeder dannes ved næste opdateringskørsel."
            exit 1
          fi
          git rebase "origin/$SHARING_BRANCH"
          python scripts/build_share_pages.py --check
          git push origin "HEAD:$SHARING_BRANCH"

      - name: Bestil publicering af den validerede version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

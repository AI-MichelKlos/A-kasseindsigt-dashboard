name: Koer verificeret samtale- og efterloensopdatering

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-talks-afterlon-fixed.yml

permissions:
  contents: write

concurrency:
  group: a-kasseindsigt-feature-change-fixed
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Anvend feature-patch med verificeret aarsperiode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Genbrug den allerede gennemgåede patch-logik fra feature-workflowet.
          workflow = Path('.github/workflows/apply-talks-afterlon.yml').read_text(encoding='utf-8')
          token = "          python - <<'PY'\n"
          start = workflow.index(token) + len(token)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, 'apply-talks-afterlon-inline.py', 'exec'), {})

          # Den årlige Jobindsats-serie bruger periodetype Y.
          path = Path('scripts/jobindsats_api.py')
          text = path.read_text(encoding='utf-8')
          old = 'for period_type in ("M", "Q", "A"):'
          if old in text:
              text = text.replace(old, 'for period_type in ("M", "Q", "A", "Y"):', 1)
          elif 'for period_type in ("M", "Q", "A", "Y"):' not in text:
              raise RuntimeError('Kunne ikke tilføje Y-periodetype')
          path.write_text(text, encoding='utf-8')

          # Sorter Jobindsats-årskoder som 2025Y01 kronologisk.
          path = Path('scripts/jobindsats_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '    a = re.fullmatch(r"(\\d{4})", text)\n    if a:\n        return int(a.group(1)), 12\n'
          new = '    a = re.fullmatch(r"(\\d{4})Y\\d{2}", text)\n    if a:\n        return int(a.group(1)), 12\n'
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Vis årskoder som rene årstal, og lad periodevælgeren betyde år også for årsserien.
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = "return p||'-'};const pct"
          if marker in text:
              text = text.replace(marker, "m=/^(\\d{4})Y\\d{2}$/.exec(p||'');if(m)return m[1];return p||'-'};const pct", 1)
          annual_fn = "function compareJobAnnual(k,id,moduleKey,field,percent=false){const f=fund(),a=f?.jobindsats?.[moduleKey];if(!a){missing(id.replace('Chart','Wrap'));return}const n=Math.max(1,Math.ceil(+$('periodSelect').value/12)),w=seriesWindow(a,field,n),sets=[{label:f.name,data:w.values,borderColor:C.gd,backgroundColor:C.gd,pointRadius:0,borderWidth:2.6,tension:.18,spanGaps:false}];compareCodes().forEach((code,i)=>{const b=DATA.funds[code]?.jobindsats?.[moduleKey];if(!b)return;sets.push({label:DATA.funds[code].name,data:mapValues(b,field,w.labels),borderColor:color(i),backgroundColor:color(i),pointRadius:0,borderWidth:2,tension:.18,spanGaps:false})});lineChart(k,id,w.labels,sets,percent,true)}"
          if 'function compareJobAnnual(' not in text:
              text = text.replace('function shares(items){', annual_fn + 'function shares(items){', 1)
          text = text.replace("compareJobTime('ac','afterlonContribChart','afterlonContrib','share',true,false,true)", "compareJobAnnual('ac','afterlonContribChart','afterlonContrib','share',true)", 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Koer fuld opdatering og kvalitetsporte
        shell: bash
        run: |
          python -m py_compile scripts/statbank_api.py scripts/jobindsats_api.py scripts/fetch_sources.py scripts/jobindsats_patch.py scripts/apply_dak_names.py scripts/run_update.py scripts/validate_dashboard_repo.py
          python scripts/run_update.py
          python scripts/validate_dashboard_repo.py --repo . --require-source AUA01 --require-source AUP03 --require-source jobDagpenge --require-source jobDimittend --require-source jobTalkForms --require-source jobAfterlon --require-source jobAfterlonContrib --require-source jobLongTerm --require-source jobExhaustedRights --require-source jobSanctions --require-source jobDagpengeforbrug --require-source jobOverlevelse --require-source jobStatusAfter

      - name: Gem kun valideret produktionsversion
        shell: bash
        run: |
          git config user.name "Dashboard automation"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html README.md scripts/jobindsats_api.py scripts/fetch_sources.py scripts/jobindsats_patch.py scripts/run_update.py .github/workflows/update-dashboard.yml data/dashboard-data.json
          if git diff --cached --quiet; then
            echo "Ingen ændringer at gemme."
          else
            git commit -m "Udskift samtalemaal og tilfoej efterloen"
            git push origin HEAD:main
          fi
